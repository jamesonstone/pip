name: Pip
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  PipCore:
    path: Packages/PipCore
targets:
  Pip-iOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Entitlements/**
      - path: Shared
    dependencies:
      - package: PipCore
        product: PipCore
      - target: PipShare-iOS
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER_PREFIX).pip
        PRODUCT_NAME: Pip
        PRODUCT_MODULE_NAME: Pip
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Pip
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: App/Entitlements/Pip-iOS.entitlements
  Pip-macOS:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Entitlements/**
      - path: Shared
    dependencies:
      - package: PipCore
        product: PipCore
      - target: PipShare-macOS
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER_PREFIX).pip
        PRODUCT_NAME: Pip
        PRODUCT_MODULE_NAME: Pip
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Pip
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: App/Entitlements/Pip-macOS.entitlements
  PipShare-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - Info.plist
          - Entitlements/**
      - path: Shared
    dependencies:
      - package: PipCore
        product: PipCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER_PREFIX).pip.share
        PRODUCT_NAME: PipShare
        PRODUCT_MODULE_NAME: PipShare
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ShareExtension/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Pip
        INFOPLIST_KEY_CFBundleName: Pip
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ShareExtension/Entitlements/PipShare-iOS.entitlements
  PipShare-macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: ShareExtension
        excludes:
          - Info.plist
          - Entitlements/**
      - path: Shared
    dependencies:
      - package: PipCore
        product: PipCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER_PREFIX).pip.share
        PRODUCT_NAME: PipShare
        PRODUCT_MODULE_NAME: PipShare
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ShareExtension/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Pip
        INFOPLIST_KEY_CFBundleName: Pip
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ShareExtension/Entitlements/PipShare-macOS.entitlements
schemes:
  Pip-iOS:
    build:
      targets:
        Pip-iOS: all
        PipShare-iOS: all
    run:
      config: Debug
      target: Pip-iOS
    archive:
      config: Release
      target: Pip-iOS
  Pip-macOS:
    build:
      targets:
        Pip-macOS: all
        PipShare-macOS: all
    run:
      config: Debug
      target: Pip-macOS
    archive:
      config: Release
      target: Pip-macOS
